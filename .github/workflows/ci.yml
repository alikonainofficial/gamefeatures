name: CI

on:
  push:
    branches: [main, improvement-plan]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Matches apps/api/test/.env.test; no real secrets are needed anywhere in CI.
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game_review_test?schema=public

    steps:
      - uses: actions/checkout@v7

      # No `version`: the action reads it from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create test database and apply migrations
        run: pnpm --filter @game-review/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # `node apps/api/dist/main.js` is the production entry point (start script, Dockerfile).
      - name: Check API build output
        run: test -f apps/api/dist/main.js

      - name: Unit tests
        run: pnpm test

      # pnpm 8 passes a literal `--` through to Jest, so the flag goes straight after the script.
      - name: End-to-end tests (with coverage)
        run: pnpm --filter @game-review/api test:e2e --coverage
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: redis://localhost:6379/1

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Build and boot the API image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_review_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t gamefeatures-api .

      # The container migrates the empty database on start, then serves the API; this proves
      # the image (what Render runs) works, not just the source.
      - name: Boot image and check health
        run: |
          URL=postgresql://postgres:postgres@localhost:5432/game_review_image?schema=public
          docker run -d --name api --network host \
            -e PORT=3001 -e DATABASE_URL="$URL" -e DIRECT_URL="$URL" \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-only-jwt-secret -e JWT_REFRESH_SECRET=ci-only-refresh-secret \
            gamefeatures-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/v1/health
          curl -fsS -o /dev/null http://localhost:3001/docs

      # Seed the image's (already migrated) database and run the production smoke test
      # against the container, so scripts/smoke-test.sh is exercised on every push.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Seed demo data
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game_review_image?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/game_review_image?schema=public

      # The API serves /api/v1 itself, so its own URL stands in for the web origin here.
      - name: Smoke test the running image
        run: pnpm smoke http://localhost:3001

      - name: Container logs
        if: ${{ always() }}
        run: docker logs api || true
